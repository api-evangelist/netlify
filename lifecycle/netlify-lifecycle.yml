description: >-
  Versioning, deprecation, support and availability posture for the Netlify REST API. The API has
  been on a single path version since launch, Netlify commits to keeping old URLs working across
  breaking changes, and there is no formal deprecation-header practice.

versioning:
  scheme: path prefix
  current: v1
  base_url: https://api.netlify.com/api/v1
  spec_version: 2.57.0
  spec_version_source: https://open-api.netlify.com/swagger.json
  spec_package: '@netlify/open-api@2.57.0 (npm), github.com/netlify/open-api/v2 v2.57.0 (Go)'
  policy_statement: >-
    "The path is prefixed with the API version. If we change the API in backward-incompatible
    ways, we'll bump the version marker and maintain stable support for the old URLs."
  policy_source: https://docs.netlify.com/api-and-cli-guides/api-guides/get-started-with-api/
  observed: >-
    The version marker has never been bumped. The contract has grown additively — open-api
    2.33.1 declared 133 operations and 2.57.0 declares 180, with no operation removed.

deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  detail: >-
    No operation in the OpenAPI carries `deprecated: true`, and Netlify publishes no deprecation
    policy page, no Sunset or Deprecation response headers, and no advance-notice window for
    API removals. Product deprecations are announced in the changelog and the docs instead — the
    pricing page marks Large Media as "(Deprecated)", Netlify Graph (the GraphQL surface, see
    graphql/netlify-graphql.md) was retired outright and its host no longer resolves, and the
    2026-05-21 changelog entry ends Build Plugins support for Node.js 18 and 20. None of these
    was signalled in-band.
  product_deprecations_observed:
    - name: Netlify Graph / GraphQL API
      status: retired
      detail: graph.netlify.com no longer resolves. See graphql/netlify-graphql.md.
    - name: Large Media
      status: deprecated
      source: https://www.netlify.com/pricing/
    - name: Build Plugins on Node.js 18 and 20
      status: end of support
      date: '2026-05-21'
      source: https://www.netlify.com/changelog/

