description: >-
  First-party Netlify client libraries, CLI, platform primitives and framework adapters.
  Netlify's public API client story is JavaScript/TypeScript first: the Node.js API client
  (@netlify/api) is generated from the same open-api definition that backs
  https://open-api.netlify.com/swagger.json. There is no first-party Python, Java, .NET,
  PHP or Rust client; the maintained Ruby and Go artifacts are, respectively, a 2016-era
  gem and the Go module that ships the OpenAPI definition itself.
languages_covered: [javascript, typescript, go, ruby]
languages_not_covered: [python, java, dotnet, php, ruby-modern, rust]
