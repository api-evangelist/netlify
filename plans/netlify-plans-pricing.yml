# --- Added 2026-08-27, read verbatim from https://www.netlify.com/pricing/ ---
billing_model: credit-based
credit_consumption:
  - item: Production deploy
    rate: 15 credits each
    note: Deploy Previews and branch deploys are unlimited and not charged.
  - item: Compute
    rate: 10 credits per GB-hour
    note: Covers serverless functions, Agent Runs, and Netlify Database compute.
  - item: Bandwidth
    rate: 20 credits per GB
    note: Web bandwidth plus Netlify Database egress.
  - item: Web requests
    rate: 2 credits per 10k requests
  - item: AI inference
    rate: varies by model
add_on_credits:
  enabled_by: auto recharge (disabled by default)
  tiers:
    - price: '5.00'
      credits: 500
    - price: '10.00'
      credits: 1500
    - price: custom
      credits: custom
      plan: Enterprise
per_plan_limits:
  deploy_retention:
    free: 30 days
    personal: 90 days
    pro: 90 days
    enterprise: up to 365 days (configurable by Owners and Developers)
    source: https://docs.netlify.com/deploy/manage-deploys/manage-deploys-overview/#deploy-retention
  observability_retention:
    personal: 1 day
    pro: 30 days
  concurrent_builds:
    free: 1
    personal: 1 (then $40 each)
    pro: 3 (then $40 each)
    enterprise: custom
  preview_servers:
    free: 1
    personal: 1 (then $15 each)
    pro: 1 (then $15 each)
api_pricing_note: >-
  There is no separate charge for calling the Netlify REST API and no API-specific plan. API
  usage consumes the same credit pool as the platform, so an agent driving deploys is metered
  at 15 credits per production deploy exactly as a human is.
calculator: https://www.netlify.com/pricing/
