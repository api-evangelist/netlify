aid: netlify
name: Netlify
description: >-
  Netlify is a cloud platform for building, deploying and scaling modern web applications, with
  continuous deployment from Git, serverless and edge functions, a global CDN, forms, identity,
  Postgres storage and an image CDN. Its public REST API at https://api.netlify.com/api/v1 is
  described by an OpenAPI that Netlify maintains in the open at github.com/netlify/open-api and
  serves at open-api.netlify.com, covering deploys, sites, DNS, builds, forms, environment
  variables and split tests. Netlify also ships an unusually complete agent surface: an RFC 9727
  API catalog at the domain root, an OAuth-gated remote MCP server, fifteen published Agent
  Skills, an llms.txt, and a Markdown twin of every documentation page.
kind: contract
