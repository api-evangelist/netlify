command_count: 27
key_flows:
  - name: Link an existing project and develop locally
    steps: [netlify clone <repo>, netlify dev]
  - name: Set up continuous deployment
    steps: [netlify init, 'netlify init --manual (to supply your own deploy key and webhook)']
  - name: Manual production deploy
    steps: [netlify build, netlify deploy --prod]
  - name: Rehearse a build without running it
    steps: [netlify build --dry]
  - name: Create a project from a prompt
    steps: ['netlify create "a landing page for a SaaS product with a waitlist signup"']
  - name: Call an unwrapped REST operation
    steps: ['netlify api <operationId> --data ''{...}''']
relationship_to_mcp: >-
  The local stdio MCP server (@netlify/mcp) instructs the agent to install netlify-cli and uses
  it for the deploy path, so on a local install the CLI is a dependency of the MCP surface rather
  than an alternative to it. The hosted remote MCP server does not need it.
