openapi: 3.2.0
info:
  title: Netlify Build Log Msg API
  termsOfService: https://www.netlify.com/legal/terms-of-use/
  x-logo:
    url: netlify-logo.png
    href: https://www.netlify.com/docs/
    altText: Netlify
  version: '1.0'
  description: 'Operations tagged buildLogMsg across 2 of this provider''s published API definitions: netlify-buildlogmsg-api-openapi.yml, netlify-openapi-2.57.0-swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: buildLogMsg
  x-displayName: Build log message
paths:
  /builds/{build_id}/log:
    post:
      tags:
      - buildLogMsg
      operationId: updateSiteBuildLog
      parameters:
      - name: build_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/buildLogMsg'
        required: true
      responses:
        '204':
          description: No content
          content: {}
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-codegen-request-body-name: msg
    parameters:
    - name: build_id
      in: path
      required: true
      schema:
        type: string
    servers:
    - url: https://api.netlify.com/api/v1
components:
  schemas:
    buildLogMsg:
      type: object
      properties:
        message:
          type: string
        error:
          type: boolean
        section:
          type: string
          enum:
          - initializing
          - building
          - deploying
          - cleanup
          - postprocessing
    error:
      required:
      - message
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
  securitySchemes:
    netlifyAuth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://app.netlify.com/authorize
          scopes: {}
externalDocs:
  description: Online documentation
  url: https://www.netlify.com/docs/api/
