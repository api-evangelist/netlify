servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: devServerHook
  x-displayName: Dev server hook
paths:
  /sites/{site_id}/dev_server_hooks:
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: listSiteDevServerHooks
      tags:
      - devServerHook
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    branch:
                      type: string
                    url:
                      type: string
                    site_id:
                      type: string
                    created_at:
                      type: string
                      format: dateTime
                    type:
                      type: string
                      enum:
                      - new_dev_server
                      - content_refresh
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: List site dev server hooks
      x-summary-source: derived
    post:
      operationId: createSiteDevServerHook
      tags:
      - devServerHook
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  branch:
                    type: string
                  url:
                    type: string
                  site_id:
                    type: string
                  created_at:
                    type: string
                    format: dateTime
                  type:
                    type: string
                    enum:
                    - new_dev_server
                    - content_refresh
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                branch:
                  type: string
                type:
                  type: string
                  enum:
                  - new_dev_server
                  - content_refresh
        required: true
      summary: Create site dev server hook
      x-summary-source: derived
  /sites/{site_id}/dev_server_hooks/{id}:
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getSiteDevServerHook
      tags:
      - devServerHook
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  branch:
                    type: string
                  url:
                    type: string
                  site_id:
                    type: string
                  created_at:
                    type: string
                    format: dateTime
                  type:
                    type: string
                    enum:
                    - new_dev_server
                    - content_refresh
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: Get site dev server hook
      x-summary-source: derived
    put:
      operationId: updateSiteDevServerHook
      tags:
      - devServerHook
      responses:
        '204':
          description: No content
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                branch:
                  type: string
                type:
                  type: string
                  enum:
                  - new_dev_server
                  - content_refresh
        required: true
      summary: Update site dev server hook
      x-summary-source: derived
    delete:
      operationId: deleteSiteDevServerHook
      tags:
      - devServerHook
      responses:
        '204':
          description: No content
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: Delete site dev server hook
      x-summary-source: derived
