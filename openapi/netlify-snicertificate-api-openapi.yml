openapi: 3.2.0
info:
  title: Netlify Sni Certificate API
  termsOfService: https://www.netlify.com/legal/terms-of-use/
  x-logo:
    url: netlify-logo.png
    href: https://www.netlify.com/docs/
    altText: Netlify
  version: '1.0'
  description: 'Operations tagged sniCertificate across 2 of this provider''s published API definitions: netlify-openapi-2.57.0-swagger.json, netlify-snicertificate-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: sniCertificate
  x-displayName: SNI certificate
paths:
  /sites/{site_id}/ssl:
    post:
      operationId: provisionSiteTLSCertificate
      tags:
      - sniCertificate
      description: 'Provisions or updates a TLS certificate for the site.


        **Creating a certificate (site has no certificate):**

        - Omit certificate params to initiate Let''s Encrypt provisioning

        - Provide certificate, key, and ca_certificates to upload a custom certificate


        **Updating a certificate (site already has a certificate):**

        - REQUIRES certificate, key, and ca_certificates to replace with a new custom certificate

        - Use POST /api/v1/sites/{site_id}/ssl/renew to renew an existing Let''s Encrypt certificate'
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      - name: certificate
        in: query
        description: PEM-encoded certificate. Required when updating an existing certificate.
        schema:
          type: string
      - name: key
        in: query
        description: PEM-encoded private key. Required when updating an existing certificate.
        schema:
          type: string
      - name: ca_certificates
        in: query
        description: PEM-encoded CA certificate chain. Required when updating an existing certificate.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                  domains:
                    type: array
                    items:
                      type: string
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
                  expires_at:
                    type: string
                    format: dateTime
        '422':
          description: 'Unprocessable Entity. Returns errors such as: "certificate parameter is required when updating an existing certificate" (when updating without params), "No custom domain configured", or "bad dns for custom domain"'
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
    get:
      operationId: showSiteTLSCertificate
      tags:
      - sniCertificate
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                  domains:
                    type: array
                    items:
                      type: string
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
                  expires_at:
                    type: string
                    format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
    servers:
    - url: https://api.netlify.com/api/v1
  /sites/{site_id}/ssl/certificates:
    get:
      operationId: getAllCertificates
      tags:
      - sniCertificate
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      - name: domain
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Array of SNI Certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    state:
                      type: string
                    domains:
                      type: array
                      items:
                        type: string
                    created_at:
                      type: string
                      format: dateTime
                    updated_at:
                      type: string
                      format: dateTime
                    expires_at:
                      type: string
                      format: dateTime
        '404':
          description: Not Found
        '422':
          description: Unprocessable Entity
    servers:
    - url: https://api.netlify.com/api/v1
components:
  schemas:
    sniCertificate:
      type: object
      properties:
        state:
          type: string
        domains:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: dateTime
        updated_at:
          type: string
          format: dateTime
        expires_at:
          type: string
          format: dateTime
    error:
      required:
      - message
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
  securitySchemes:
    netlifyAuth:
      type: oauth2
      flows:
        implicit:
          scopes: {}
          authorizationUrl: https://app.netlify.com/authorize
externalDocs:
  url: https://www.netlify.com/docs/api/
  description: Online documentation
