openapi: 3.2.0
info:
  version: 2.57.0
  title: Netlify's API documentation Submission API
  description: Netlify is a hosting service for the programmable web.
  termsOfService: https://www.netlify.com/legal/terms-of-use/
  x-logo:
    url: netlify-logo.png
    href: https://www.netlify.com/docs/
    altText: Netlify
servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: Submission
  x-displayName: Form submission
paths:
  /sites/{site_id}/submissions:
    get:
      operationId: listSiteSubmissions
      tags:
      - Submission
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        required: false
        in: query
        schema:
          type: integer
          format: int32
      - name: per_page
        required: false
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    number:
                      type: integer
                      format: int32
                    email:
                      type: string
                    name:
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
                    company:
                      type: string
                    summary:
                      type: string
                    body:
                      type: string
                    data:
                      type: object
                    created_at:
                      type: string
                      format: dateTime
                    site_url:
                      type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: List site submissions
      x-summary-source: derived
  /forms/{form_id}/submissions:
    get:
      operationId: listFormSubmissions
      tags:
      - Submission
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        required: false
        in: query
        schema:
          type: integer
          format: int32
      - name: per_page
        required: false
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    number:
                      type: integer
                      format: int32
                    email:
                      type: string
                    name:
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
                    company:
                      type: string
                    summary:
                      type: string
                    body:
                      type: string
                    data:
                      type: object
                    created_at:
                      type: string
                      format: dateTime
                    site_url:
                      type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: List form submissions
      x-summary-source: derived
  /submissions/{submission_id}:
    parameters:
    - name: submission_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: listFormSubmission
      tags:
      - Submission
      parameters:
      - name: query
        in: query
        schema:
          type: string
      - name: page
        required: false
        in: query
        schema:
          type: integer
          format: int32
      - name: per_page
        required: false
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    number:
                      type: integer
                      format: int32
                    email:
                      type: string
                    name:
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
                    company:
                      type: string
                    summary:
                      type: string
                    body:
                      type: string
                    data:
                      type: object
                    created_at:
                      type: string
                      format: dateTime
                    site_url:
                      type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: List form submission
      x-summary-source: derived
    delete:
      operationId: deleteSubmission
      tags:
      - Submission
      responses:
        '204':
          description: Deleted
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: Delete submission
      x-summary-source: derived
components:
  securitySchemes:
    netlifyAuth:
      type: oauth2
      flows:
        implicit:
          scopes: {}
          authorizationUrl: https://app.netlify.com/authorize
externalDocs:
  url: https://www.netlify.com/docs/api/
  description: Online documentation
