  version: '1.0'
  description: 'Operations tagged devServer across 2 of this provider''s published API definitions: netlify-devserver-api-openapi.yml, netlify-openapi-2.57.0-swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: devServer
  x-displayName: Dev server
paths:
  /sites/{site_id}/dev_servers:
    get:
      tags:
      - devServer
      operationId: listSiteDevServers
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: per_page
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/devServer'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    post:
      tags:
      - devServer
      operationId: createSiteDevServer
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      - name: branch
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/devServer'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    delete:
      tags:
      - devServer
      operationId: deleteSiteDevServers
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      - name: branch
        in: query
        schema:
          type: string
      responses:
        '202':
          description: OK
          content: {}
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
    servers:
    - url: https://api.netlify.com/api/v1
  /sites/{site_id}/dev_servers/{dev_server_id}:
    get:
      tags:
      - devServer
      operationId: getSiteDevServer
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      - name: dev_server_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/devServer'
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
    - name: dev_server_id
      in: path
      required: true
      schema:
        type: string
    servers:
    - url: https://api.netlify.com/api/v1
  /sites/{site_id}/dev_servers/{dev_server_id}/activity:
    post:
      tags:
      - devServer
      operationId: markDevServerActivity
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      - name: dev_server_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content: {}
      x-internal: true
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
    - name: dev_server_id
      in: path
      required: true
      schema:
        type: string
    servers:
    - url: https://api.netlify.com/api/v1
  /sites/{site_id}/dev_servers/{dev_server_id}/state:
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
    - name: dev_server_id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: updateDevServerState
      tags:
      - devServer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  site_id:
                    type: string
                  branch:
                    type: string
                  url:
                    type: string
                  state:
                    type: string
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
                  starting_at:
                    type: string
                    format: dateTime
                  error_at:
                    type: string
                    format: dateTime
                  live_at:
                    type: string
                    format: dateTime
                  done_at:
                    type: string
                    format: dateTime
                  title:
                    type: string
        '409':
          description: Conflict
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - state
              properties:
                state:
                  type: string
                  enum:
                  - starting
                  - live
                  - error
                  - done
                task_id:
                  type: string
                error:
                  type: string
        required: true
    servers:
    - url: https://api.netlify.com/api/v1
components:
