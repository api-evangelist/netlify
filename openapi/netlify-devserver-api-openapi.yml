        site_id:
          type: string
        branch:
          type: string
        url:
          type: string
        state:
          type: string
        created_at:
          type: string
          format: dateTime
        updated_at:
          type: string
          format: dateTime
        starting_at:
          type: string
          format: dateTime
        error_at:
          type: string
          format: dateTime
        live_at:
          type: string
          format: dateTime
        done_at:
          type: string
          format: dateTime
        title:
          type: string
    error:
      required:
      - message
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
  securitySchemes:
    netlifyAuth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://app.netlify.com/authorize
          scopes: {}
