openapi: 3.2.0
info:
  title: Netlify Account Type API
  termsOfService: https://www.netlify.com/legal/terms-of-use/
  x-logo:
    url: netlify-logo.png
    href: https://www.netlify.com/docs/
    altText: Netlify
  version: '1.0'
  description: 'Operations tagged accountType across 2 of this provider''s published API definitions: netlify-accounttype-api-openapi.yml, netlify-openapi-2.57.0-swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: accountType
  x-displayName: Access type
paths:
  /accounts/types:
    get:
      tags:
      - accountType
      operationId: listAccountTypesForUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/accountType'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    servers:
    - url: https://api.netlify.com/api/v1
components:
  schemas:
    error:
      required:
      - message
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
    accountType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        capabilities:
          type: object
          properties: {}
        monthly_dollar_price:
          type: integer
        yearly_dollar_price:
          type: integer
        monthly_seats_addon_dollar_price:
          type: integer
        yearly_seats_addon_dollar_price:
          type: integer
  securitySchemes:
    netlifyAuth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://app.netlify.com/authorize
          scopes: {}
externalDocs:
  description: Online documentation
  url: https://www.netlify.com/docs/api/
