openapi: 3.2.0
info:
  version: 2.57.0
  title: Netlify's API documentation File API
  description: Netlify is a hosting service for the programmable web.
  termsOfService: https://www.netlify.com/legal/terms-of-use/
  x-logo:
    url: netlify-logo.png
    href: https://www.netlify.com/docs/
    altText: Netlify
servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: File
  x-displayName: File
paths:
  /sites/{site_id}/files:
    get:
      operationId: listSiteFiles
      tags:
      - File
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    path:
                      type: string
                    sha:
                      type: string
                    mime_type:
                      type: string
                    size:
                      type: integer
                      format: int64
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: List site files
      x-summary-source: derived
  /sites/{site_id}/files/{file_path}:
    get:
      operationId: getSiteFileByPathName
      tags:
      - File
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      - name: file_path
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  path:
                    type: string
                  sha:
                    type: string
                  mime_type:
                    type: string
                  size:
                    type: integer
                    format: int64
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: Get site file by path name
      x-summary-source: derived
  /deploys/{deploy_id}/files/{path}:
    put:
      operationId: uploadDeployFile
      tags:
      - File
      parameters:
      - name: deploy_id
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        schema:
          type: string
      - name: size
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  path:
                    type: string
                  sha:
                    type: string
                  mime_type:
                    type: string
                  size:
                    type: integer
                    format: int64
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        required: true
      summary: Upload deploy file
      x-summary-source: derived
components:
  securitySchemes:
    netlifyAuth:
      type: oauth2
      flows:
        implicit:
          scopes: {}
          authorizationUrl: https://app.netlify.com/authorize
externalDocs:
  url: https://www.netlify.com/docs/api/
  description: Online documentation
