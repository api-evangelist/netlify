  version: '1.0'
  description: 'Operations tagged x-internal across 2 of this provider''s published API definitions: netlify-openapi-2.57.0-swagger.json, netlify-x-internal-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: x-internal
paths:
  /sites/{site_id}/plugins/{package}:
    put:
      x-internal: true
      operationId: updatePlugin
      tags:
      - x-internal
      description: This is an internal-only endpoint.
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      - name: package
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  package:
                    type: string
                  pinned_version:
                    type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pinned_version:
                  type: string
    servers:
    - url: https://api.netlify.com/api/v1
  /sites/{site_id}/plugin_runs/latest:
    get:
      x-internal: true
      operationId: getLatestPluginRuns
      tags:
      - x-internal
      description: This is an internal-only endpoint.
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      - name: packages
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
      - name: state
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - type: object
                    properties:
                      package:
                        type: string
                      version:
                        type: string
                      state:
                        type: string
                      reporting_event:
                        type: string
                      title:
                        type: string
                      summary:
                        type: string
                      text:
                        type: string
                  - type: object
                    properties:
                      deploy_id:
                        type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
    servers:
    - url: https://api.netlify.com/api/v1
  /deploys/{deploy_id}/plugin_runs:
    post:
      x-internal: true
      operationId: createPluginRun
      tags:
      - x-internal
      description: This is an internal-only endpoint.
      parameters:
      - name: deploy_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: CREATED
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    package:
                      type: string
                    version:
                      type: string
                    state:
                      type: string
                    reporting_event:
                      type: string
                    title:
                      type: string
                    summary:
                      type: string
                    text:
                      type: string
                - type: object
                  properties:
                    deploy_id:
                      type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                package:
                  type: string
                version:
                  type: string
                state:
                  type: string
                reporting_event:
                  type: string
                title:
                  type: string
                summary:
                  type: string
                text:
                  type: string
    servers:
    - url: https://api.netlify.com/api/v1
components:
  schemas:
    error:
      required:
      - message
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
    pluginRun:
      allOf:
      - $ref: '#/components/schemas/pluginRunData'
      - type: object
        properties:
          deploy_id:
            type: string
    pluginRunData:
      type: object
      properties:
        package:
          type: string
        version:
          type: string
        state:
          type: string
        reporting_event:
          type: string
        title:
          type: string
        summary:
          type: string
        text:
          type: string
    pluginParams:
      type: object
      properties:
        pinned_version:
          type: string
    plugin:
      type: object
      properties:
        package:
          type: string
        pinned_version:
          type: string
  securitySchemes:
    netlifyAuth:
      type: oauth2
      flows:
        implicit:
          scopes: {}
          authorizationUrl: https://app.netlify.com/authorize
externalDocs:
