openapi: 3.2.0
info:
  title: Netlify Member API
  termsOfService: https://www.netlify.com/legal/terms-of-use/
  x-logo:
    url: netlify-logo.png
    href: https://www.netlify.com/docs/
    altText: Netlify
  version: '1.0'
  description: 'Operations tagged Member across 2 of this provider''s published API definitions: netlify-member-api-openapi.yml, netlify-openapi-2.57.0-swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: Member
  x-displayName: Member
paths:
  /{account_slug}/members:
    get:
      tags:
      - Member
      operationId: listMembersForAccount
      parameters:
      - name: account_slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/member'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    post:
      tags:
      - Member
      operationId: addMemberToAccount
      parameters:
      - name: account_slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/accountAddMemberSetup'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/member'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-codegen-request-body-name: accountAddMemberSetup
    parameters:
    - name: account_slug
      in: path
      required: true
      schema:
        type: string
    servers:
    - url: https://api.netlify.com/api/v1
  /{account_slug}/members/{member_id}:
    get:
      tags:
      - Member
      operationId: getAccountMember
      parameters:
      - name: account_slug
        in: path
        required: true
        schema:
          type: string
      - name: member_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/member'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    put:
      tags:
      - Member
      operationId: updateAccountMember
      parameters:
      - name: account_slug
        in: path
        required: true
        schema:
          type: string
      - name: member_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/accountUpdateMemberSetup'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/member'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-codegen-request-body-name: accountUpdateMemberSetup
    delete:
      tags:
      - Member
      operationId: removeAccountMember
      parameters:
      - name: account_slug
        in: path
        required: true
        schema:
          type: string
      - name: member_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Not Content
          content: {}
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    parameters:
    - name: account_slug
      in: path
      required: true
      schema:
        type: string
    - name: member_id
      in: path
      required: true
      schema:
        type: string
    servers:
    - url: https://api.netlify.com/api/v1
components:
  schemas:
    error:
      required:
      - message
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
    member:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
        email:
          type: string
        avatar:
          type: string
        role:
          type: string
    accountAddMemberSetup:
      type: object
      properties:
        role:
          type: string
          enum:
          - Owner
          - Developer
          - Billing Admin
          - Reviewer
        email:
          type: string
    accountUpdateMemberSetup:
      type: object
      properties:
        role:
          type: string
          enum:
          - Owner
          - Developer
          - Billing Admin
          - Reviewer
        site_access:
          type: string
          enum:
          - all
          - none
          - selected
        site_ids:
          type: array
          items:
            type: string
  securitySchemes:
    netlifyAuth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://app.netlify.com/authorize
          scopes: {}
externalDocs:
  description: Online documentation
  url: https://www.netlify.com/docs/api/
