openapi: 3.2.0
info:
  title: Netlify Dns Zone API
  termsOfService: https://www.netlify.com/legal/terms-of-use/
  x-logo:
    url: netlify-logo.png
    href: https://www.netlify.com/docs/
    altText: Netlify
  version: '1.0'
  description: 'Operations tagged dnsZone across 2 of this provider''s published API definitions: netlify-dnszone-api-openapi.yml, netlify-openapi-2.57.0-swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: dnsZone
  x-displayName: DNS zone
paths:
  /sites/{site_id}/dns:
    get:
      tags:
      - dnsZone
      operationId: getDNSForSite
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/dnsZone'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    put:
      tags:
      - dnsZone
      operationId: configureDNSForSite
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/dnsZone'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
    servers:
    - url: https://api.netlify.com/api/v1
  /dns_zones:
    get:
      tags:
      - dnsZone
      operationId: getDnsZones
      parameters:
      - name: account_slug
        in: query
        schema:
          type: string
      responses:
        '200':
          description: get all DNS zones the user has access to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dnsZones'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    post:
      tags:
      - dnsZone
      operationId: createDnsZone
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dnsZoneSetup'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dnsZone'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-codegen-request-body-name: DnsZoneParams
    servers:
    - url: https://api.netlify.com/api/v1
  /dns_zones/{zone_id}:
    get:
      tags:
      - dnsZone
      operationId: getDnsZone
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: get a single DNS zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dnsZone'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    delete:
      tags:
      - dnsZone
      operationId: deleteDnsZone
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: delete a single DNS zone
          content: {}
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    parameters:
    - name: zone_id
      in: path
      required: true
      schema:
        type: string
    servers:
    - url: https://api.netlify.com/api/v1
  /dns_zones/{zone_id}/transfer:
    put:
      tags:
      - dnsZone
      operationId: transferDnsZone
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          type: string
      - name: account_id
        in: query
        description: the account of the dns zone
        required: true
        schema:
          type: string
      - name: transfer_account_id
        in: query
        description: the account you want to transfer the dns zone to
        required: true
        schema:
          type: string
      - name: transfer_user_id
        in: query
        description: the user you want to transfer the dns zone to
        required: true
        schema:
          type: string
      responses:
        '200':
          description: transfer a DNS zone to another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dnsZone'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    parameters:
    - name: zone_id
      in: path
      required: true
      schema:
        type: string
    - name: account_id
      in: query
      description: the account of the dns zone
      required: true
      schema:
        type: string
    - name: transfer_account_id
      in: query
      description: the account you want to transfer the dns zone to
      required: true
      schema:
        type: string
    - name: transfer_user_id
      in: query
      description: the user you want to transfer the dns zone to
      required: true
      schema:
        type: string
    servers:
    - url: https://api.netlify.com/api/v1
  /dns_zones/{zone_id}/dns_records:
    get:
      tags:
      - dnsZone
      operationId: getDnsRecords
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: get all DNS records for a single DNS zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dnsRecords'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    post:
      tags:
      - dnsZone
      operationId: createDnsRecord
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dnsRecordCreate'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dnsRecord'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      x-codegen-request-body-name: dns_record
    parameters:
    - name: zone_id
      in: path
      required: true
      schema:
        type: string
    servers:
    - url: https://api.netlify.com/api/v1
  /dns_zones/{zone_id}/dns_records/{dns_record_id}:
    get:
      tags:
      - dnsZone
      operationId: getIndividualDnsRecord
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          type: string
      - name: dns_record_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: get a single DNS record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dnsRecord'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    delete:
      tags:
      - dnsZone
      operationId: deleteDnsRecord
      parameters:
      - name: zone_id
        in: path
        required: true
        schema:
          type: string
      - name: dns_record_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: record deleted
          content: {}
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    parameters:
    - name: zone_id
      in: path
      required: true
      schema:
        type: string
    - name: dns_record_id
      in: path
      required: true
      schema:
        type: string
    servers:
    - url: https://api.netlify.com/api/v1
components:
  schemas:
    error:
      required:
      - message
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
    dnsZone:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        errors:
          type: array
          items:
            type: string
        supported_record_types:
          type: array
          items:
            type: string
        user_id:
          type: string
        created_at:
          type: string
          format: dateTime
        updated_at:
          type: string
          format: dateTime
        records:
          type: array
          items:
            $ref: '#/components/schemas/dnsRecord'
        dns_servers:
          type: array
          items:
            type: string
        account_id:
          type: string
        site_id:
          type: string
        account_slug:
          type: string
        account_name:
          type: string
        domain:
          type: string
        ipv6_enabled:
          type: boolean
        dedicated:
          type: boolean
    dnsRecord:
      type: object
      properties:
        id:
          type: string
        hostname:
          type: string
        type:
          type: string
        value:
          type: string
        ttl:
          type: integer
          format: int64
        priority:
          type: integer
          format: int64
        dns_zone_id:
          type: string
        site_id:
          type: string
        flag:
          type: integer
        tag:
          type: string
        managed:
          type: boolean
    dnsZones:
      type: array
      items:
        $ref: '#/components/schemas/dnsZone'
    dnsRecords:
      type: array
      items:
        $ref: '#/components/schemas/dnsRecord'
    dnsZoneSetup:
      type: object
      properties:
        account_slug:
          type: string
        site_id:
          type: string
        name:
          type: string
    dnsRecordCreate:
      type: object
      properties:
        type:
          type: string
        hostname:
          type: string
        value:
          type: string
        ttl:
          type: integer
          format: int64
        priority:
          type: integer
          format: int64
        weight:
          type: integer
          format: int64
        port:
          type: integer
          format: int64
        flag:
          type: integer
          format: int64
        tag:
          type: string
  securitySchemes:
    netlifyAuth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://app.netlify.com/authorize
          scopes: {}
