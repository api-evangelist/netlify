openapi: 3.2.0
info:
  version: 2.57.0
  title: Netlify's API documentation Asset API
  description: Netlify is a hosting service for the programmable web.
  termsOfService: https://www.netlify.com/legal/terms-of-use/
  x-logo:
    url: netlify-logo.png
    href: https://www.netlify.com/docs/
    altText: Netlify
servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: Asset
  x-displayName: Asset
paths:
  /sites/{site_id}/assets:
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: listSiteAssets
      tags:
      - Asset
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    site_id:
                      type: string
                    creator_id:
                      type: string
                    name:
                      type: string
                    state:
                      type: string
                    content_type:
                      type: string
                    url:
                      type: string
                    key:
                      type: string
                    visibility:
                      type: string
                    size:
                      type: integer
                      format: int64
                    created_at:
                      type: string
                      format: dateTime
                    updated_at:
                      type: string
                      format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: List site assets
      x-summary-source: derived
    post:
      operationId: createSiteAsset
      tags:
      - Asset
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
      - name: size
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: content_type
        in: query
        required: true
        schema:
          type: string
      - name: visibility
        in: query
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  form:
                    type: object
                    properties:
                      url:
                        type: string
                      fields:
                        type: object
                        additionalProperties:
                          type: string
                  asset:
                    type: object
                    properties:
                      id:
                        type: string
                      site_id:
                        type: string
                      creator_id:
                        type: string
                      name:
                        type: string
                      state:
                        type: string
                      content_type:
                        type: string
                      url:
                        type: string
                      key:
                        type: string
                      visibility:
                        type: string
                      size:
                        type: integer
                        format: int64
                      created_at:
                        type: string
                        format: dateTime
                      updated_at:
                        type: string
                        format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: Create site asset
      x-summary-source: derived
  /sites/{site_id}/assets/{asset_id}:
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
    - name: asset_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getSiteAssetInfo
      tags:
      - Asset
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  site_id:
                    type: string
                  creator_id:
                    type: string
                  name:
                    type: string
                  state:
                    type: string
                  content_type:
                    type: string
                  url:
                    type: string
                  key:
                    type: string
                  visibility:
                    type: string
                  size:
                    type: integer
                    format: int64
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: Get site asset info
      x-summary-source: derived
    put:
      operationId: updateSiteAsset
      tags:
      - Asset
      parameters:
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  site_id:
                    type: string
                  creator_id:
                    type: string
                  name:
                    type: string
                  state:
                    type: string
                  content_type:
                    type: string
                  url:
                    type: string
                  key:
                    type: string
                  visibility:
                    type: string
                  size:
                    type: integer
                    format: int64
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: Update site asset
      x-summary-source: derived
    delete:
      operationId: deleteSiteAsset
      tags:
      - Asset
      responses:
        '204':
          description: Deleted
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: Delete site asset
      x-summary-source: derived
components:
  securitySchemes:
    netlifyAuth:
      type: oauth2
      flows:
        implicit:
          scopes: {}
          authorizationUrl: https://app.netlify.com/authorize
externalDocs:
  url: https://www.netlify.com/docs/api/
  description: Online documentation
