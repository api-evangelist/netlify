openapi: 3.2.0
info:
  version: 2.57.0
  title: Netlify's API documentation Snippet API
  description: Netlify is a hosting service for the programmable web.
  termsOfService: https://www.netlify.com/legal/terms-of-use/
  x-logo:
    url: netlify-logo.png
    href: https://www.netlify.com/docs/
    altText: Netlify
servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: Snippet
  x-displayName: Snippet
paths:
  /sites/{site_id}/snippets:
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: listSiteSnippets
      tags:
      - Snippet
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int32
                    site_id:
                      type: string
                    title:
                      type: string
                    general:
                      type: string
                    general_position:
                      type: string
                    goal:
                      type: string
                    goal_position:
                      type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: List site snippets
      x-summary-source: derived
    post:
      operationId: createSiteSnippet
      tags:
      - Snippet
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int32
                  site_id:
                    type: string
                  title:
                    type: string
                  general:
                    type: string
                  general_position:
                    type: string
                  goal:
                    type: string
                  goal_position:
                    type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  format: int32
                site_id:
                  type: string
                title:
                  type: string
                general:
                  type: string
                general_position:
                  type: string
                goal:
                  type: string
                goal_position:
                  type: string
        required: true
      summary: Create site snippet
      x-summary-source: derived
  /sites/{site_id}/snippets/{snippet_id}:
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
    - name: snippet_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getSiteSnippet
      tags:
      - Snippet
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int32
                  site_id:
                    type: string
                  title:
                    type: string
                  general:
                    type: string
                  general_position:
                    type: string
                  goal:
                    type: string
                  goal_position:
                    type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: Get site snippet
      x-summary-source: derived
    put:
      operationId: updateSiteSnippet
      tags:
      - Snippet
      responses:
        '204':
          description: No content
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  format: int32
                site_id:
                  type: string
                title:
                  type: string
                general:
                  type: string
                general_position:
                  type: string
                goal:
                  type: string
                goal_position:
                  type: string
        required: true
      summary: Update site snippet
      x-summary-source: derived
    delete:
      operationId: deleteSiteSnippet
      tags:
      - Snippet
      responses:
        '204':
          description: No content
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: Delete site snippet
      x-summary-source: derived
components:
  securitySchemes:
    netlifyAuth:
      type: oauth2
      flows:
        implicit:
          scopes: {}
          authorizationUrl: https://app.netlify.com/authorize
externalDocs:
  url: https://www.netlify.com/docs/api/
  description: Online documentation
