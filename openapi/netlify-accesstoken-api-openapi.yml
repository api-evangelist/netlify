openapi: 3.2.0
info:
  title: Netlify Access Token API
  termsOfService: https://www.netlify.com/legal/terms-of-use/
  x-logo:
    url: netlify-logo.png
    href: https://www.netlify.com/docs/
    altText: Netlify
  version: '1.0'
  description: 'Operations tagged accessToken across 2 of this provider''s published API definitions: netlify-accesstoken-api-openapi.yml, netlify-openapi-2.57.0-swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: accessToken
  x-displayName: Access token
paths:
  /oauth/tickets/{ticket_id}/exchange:
    post:
      tags:
      - accessToken
      operationId: exchangeTicket
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accessToken'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    servers:
    - url: https://api.netlify.com/api/v1
components:
  schemas:
    error:
      required:
      - message
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
    accessToken:
      type: object
      properties:
        id:
          type: string
        access_token:
          type: string
        user_id:
          type: string
        user_email:
          type: string
        created_at:
          type: string
          format: dateTime
  securitySchemes:
    netlifyAuth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://app.netlify.com/authorize
          scopes: {}
externalDocs:
  description: Online documentation
  url: https://www.netlify.com/docs/api/
x-refined-from:
- netlify-accesstoken-api-openapi.yml
- netlify-openapi-2.57.0-swagger.json
