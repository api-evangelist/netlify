openapi: 3.2.0
info:
  version: 2.57.0
  title: Netlify's API documentation Service Instance API
  description: Netlify is a hosting service for the programmable web.
  termsOfService: https://www.netlify.com/legal/terms-of-use/
  x-logo:
    url: netlify-logo.png
    href: https://www.netlify.com/docs/
    altText: Netlify
servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: serviceInstance
  x-displayName: Service instance
paths:
  /sites/{site_id}/service-instances:
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: listServiceInstancesForSite
      tags:
      - serviceInstance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    url:
                      type: string
                    config:
                      type: object
                    external_attributes:
                      type: object
                    service_slug:
                      type: string
                    service_path:
                      type: string
                    service_name:
                      type: string
                    env:
                      type: object
                    snippets:
                      type: array
                      items:
                        type: object
                    auth_url:
                      type: string
                    created_at:
                      type: string
                      format: dateTime
                    updated_at:
                      type: string
                      format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: List service instances for site
      x-summary-source: derived
  /sites/{site_id}/services/{addon}/instances:
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
    - name: addon
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: createServiceInstance
      tags:
      - serviceInstance
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  url:
                    type: string
                  config:
                    type: object
                  external_attributes:
                    type: object
                  service_slug:
                    type: string
                  service_path:
                    type: string
                  service_name:
                    type: string
                  env:
                    type: object
                  snippets:
                    type: array
                    items:
                      type: object
                  auth_url:
                    type: string
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      summary: Create service instance
      x-summary-source: derived
  /sites/{site_id}/services/{addon}/instances/{instance_id}:
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
    - name: addon
      in: path
      required: true
      schema:
        type: string
    - name: instance_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: showServiceInstance
      tags:
      - serviceInstance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  url:
                    type: string
                  config:
                    type: object
                  external_attributes:
                    type: object
                  service_slug:
                    type: string
                  service_path:
                    type: string
                  service_name:
                    type: string
                  env:
                    type: object
                  snippets:
                    type: array
                    items:
                      type: object
                  auth_url:
                    type: string
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: Show service instance
      x-summary-source: derived
    put:
      operationId: updateServiceInstance
      tags:
      - serviceInstance
      responses:
        '204':
          description: No Content
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      summary: Update service instance
      x-summary-source: derived
    delete:
      operationId: deleteServiceInstance
      tags:
      - serviceInstance
      responses:
        '204':
          description: Deleted
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: Delete service instance
      x-summary-source: derived
components:
  securitySchemes:
    netlifyAuth:
      type: oauth2
      flows:
        implicit:
          scopes: {}
          authorizationUrl: https://app.netlify.com/authorize
externalDocs:
  url: https://www.netlify.com/docs/api/
  description: Online documentation
