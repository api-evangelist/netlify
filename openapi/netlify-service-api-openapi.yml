openapi: 3.2.0
info:
  version: 2.57.0
  title: Netlify's API documentation Service API
  description: Netlify is a hosting service for the programmable web.
  termsOfService: https://www.netlify.com/legal/terms-of-use/
  x-logo:
    url: netlify-logo.png
    href: https://www.netlify.com/docs/
    altText: Netlify
servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: Service
  x-displayName: Service
paths:
  /services/:
    parameters:
    - name: search
      in: query
      schema:
        type: string
    get:
      operationId: getServices
      tags:
      - Service
      responses:
        '200':
          description: services
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    slug:
                      type: string
                    service_path:
                      type: string
                    long_description:
                      type: string
                    description:
                      type: string
                    events:
                      type: array
                      items:
                        type: object
                    tags:
                      type: array
                      items:
                        type: string
                    icon:
                      type: string
                    manifest_url:
                      type: string
                    environments:
                      type: array
                      items:
                        type: string
                    created_at:
                      type: string
                      format: dateTime
                    updated_at:
                      type: string
                      format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: Get services
      x-summary-source: derived
  /services/{addonName}:
    parameters:
    - name: addonName
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: showService
      tags:
      - Service
      responses:
        '200':
          description: services
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
                  service_path:
                    type: string
                  long_description:
                    type: string
                  description:
                    type: string
                  events:
                    type: array
                    items:
                      type: object
                  tags:
                    type: array
                    items:
                      type: string
                  icon:
                    type: string
                  manifest_url:
                    type: string
                  environments:
                    type: array
                    items:
                      type: string
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: Show service
      x-summary-source: derived
  /services/{addonName}/manifest:
    parameters:
    - name: addonName
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: showServiceManifest
      tags:
      - Service
      responses:
        '201':
          description: retrieving from provider
          content:
            application/json:
              schema:
                type: object
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: Show service manifest
      x-summary-source: derived
components:
  securitySchemes:
    netlifyAuth:
      type: oauth2
      flows:
        implicit:
          scopes: {}
          authorizationUrl: https://app.netlify.com/authorize
externalDocs:
  url: https://www.netlify.com/docs/api/
  description: Online documentation
x-tagGroups:
- name: OAuth
  tags:
  - ticket
  - accessToken
- name: User accounts
  tags:
  - user
  - accountMembership
  - member
  - accountType
  - paymentMethod
  - auditLog
- name: Site
  tags:
  - site
  - environmentVariables
  - file
  - metadata
  - purge
  - snippet
- name: Domain names
  tags:
  - dnsZone
  - sniCertificate
- name: Deploys
  tags:
  - deploy
  - deployedBranch
  - deployKey
- name: Builds
  tags:
  - build
  - buildLogMsg
- name: Dev servers
  tags:
  - devServer
- name: Webhooks and notifications
  tags:
  - hook
  - hookType
  - buildHook
  - devServerHook
- name: Services
  tags:
  - service
  - serviceInstance
- name: Functions
  tags:
  - function
- name: Database
  tags:
  - database
- name: Forms
  tags:
  - form
  - submission
- name: Split tests
  tags:
  - splitTest
- name: Large media
  tags:
  - asset
  - assetPublicSignature
