openapi: 3.2.0
info:
  version: 2.57.0
  title: Netlify's API documentation Deploy API
  description: Netlify is a hosting service for the programmable web.
  termsOfService: https://www.netlify.com/legal/terms-of-use/
  x-logo:
    url: netlify-logo.png
    href: https://www.netlify.com/docs/
    altText: Netlify
servers:
- url: https://api.netlify.com/api/v1
security:
- netlifyAuth: []
tags:
- name: Deploy
  x-displayName: Deploy
paths:
  /sites/{site_id}/deploys:
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        type: string
    - name: deploy-previews
      in: query
      schema:
        type: boolean
    - name: production
      in: query
      schema:
        type: boolean
    - name: state
      in: query
      schema:
        type: string
        enum:
        - new
        - pending_review
        - accepted
        - rejected
        - enqueued
        - building
        - uploading
        - uploaded
        - preparing
        - prepared
        - processing
        - processed
        - ready
        - error
        - retrying
    - name: branch
      in: query
      schema:
        type: string
    - name: latest-published
      in: query
      schema:
        type: boolean
    get:
      operationId: listSiteDeploys
      tags:
      - Deploy
      parameters:
      - name: page
        required: false
        in: query
        schema:
          type: integer
          format: int32
      - name: per_page
        required: false
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    site_id:
                      type: string
                    user_id:
                      type: string
                    build_id:
                      type: string
                    state:
                      type: string
                    name:
                      type: string
                    url:
                      type: string
                    ssl_url:
                      type: string
                    admin_url:
                      type: string
                    deploy_url:
                      type: string
                    deploy_ssl_url:
                      type: string
                    screenshot_url:
                      type: string
                    review_id:
                      type: number
                    draft:
                      type: boolean
                    required:
                      type: array
                      items:
                        type: string
                    required_functions:
                      type: array
                      items:
                        type: string
                    required_edge_functions:
                      type: array
                      items:
                        type: string
                      description: 'An array of code_shas for the edge-function bundles that need to be uploaded to

                        complete the deploy.

                        '
                    error_message:
                      type: string
                    branch:
                      type: string
                    commit_ref:
                      type: string
                    commit_url:
                      type: string
                    skipped:
                      type: boolean
                    created_at:
                      type: string
                      format: dateTime
                    updated_at:
                      type: string
                      format: dateTime
                    published_at:
                      type: string
                      format: dateTime
                    title:
                      type: string
                    context:
                      type: string
                    locked:
                      type: boolean
                    review_url:
                      type: string
                    framework:
                      type: string
                    skew_protection_token:
                      type: string
                    function_schedules:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          cron:
                            type: string
                    functions_region:
                      type: string
                      description: 'The functions region for this deploy as an airport code.

                        '
                    functions_region_overrides:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          region:
                            type: string
                      description: 'Functions in the deploy that explicitly specify their own region

                        (airport code).

                        '
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      summary: List site deploys
      x-summary-source: derived
    post:
      operationId: createSiteDeploy
      tags:
      - Deploy
      parameters:
      - name: title
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  site_id:
                    type: string
                  user_id:
                    type: string
                  build_id:
                    type: string
                  state:
                    type: string
                  name:
                    type: string
                  url:
                    type: string
                  ssl_url:
                    type: string
                  admin_url:
                    type: string
                  deploy_url:
                    type: string
                  deploy_ssl_url:
                    type: string
                  screenshot_url:
                    type: string
                  review_id:
                    type: number
                  draft:
                    type: boolean
                  required:
                    type: array
                    items:
                      type: string
                  required_functions:
                    type: array
                    items:
                      type: string
                  required_edge_functions:
                    type: array
                    items:
                      type: string
                    description: 'An array of code_shas for the edge-function bundles that need to be uploaded to

                      complete the deploy.

                      '
                  error_message:
                    type: string
                  branch:
                    type: string
                  commit_ref:
                    type: string
                  commit_url:
                    type: string
                  skipped:
                    type: boolean
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
                  published_at:
                    type: string
                    format: dateTime
                  title:
                    type: string
                  context:
                    type: string
                  locked:
                    type: boolean
                  review_url:
                    type: string
                  framework:
                    type: string
                  skew_protection_token:
                    type: string
                  function_schedules:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        cron:
                          type: string
                  functions_region:
                    type: string
                    description: 'The functions region for this deploy as an airport code.

                      '
                  functions_region_overrides:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        region:
                          type: string
                    description: 'Functions in the deploy that explicitly specify their own region

                      (airport code).

                      '
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: "Deploy files can be provided in two ways:\n1. As a JSON object using 'files' (a hash mapping file paths to SHA1 digests), OR\n2. As a zip file using one of these methods:\n   - Set Content-Type to 'application/zip' and send the zip file as the raw request body\n   - Include the zip file content in the 'zip' field of this JSON object with Content-Type 'application/json'\n"
              properties:
                files:
                  type: object
                  description: A hash mapping file paths to SHA1 digests of the file contents.
                zip:
                  type: string
                  format: binary
                  description: 'A zip file containing the site files to deploy. Alternative to ''files''.

                    To use this field, set Content-Type to ''application/json'' and include the zip content here.

                    Alternatively, you can set Content-Type to ''application/zip'' and send the zip as the raw request body (not as JSON).

                    '
                draft:
                  type: boolean
                async:
                  type: boolean
                functions:
                  type: object
                edge_functions:
                  type: object
                  description: 'A hash mapping edge-function bundle formats to the code_sha of each bundle. The

                    response''s required_edge_functions lists which of these still need to be uploaded.

                    '
                function_schedules:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      cron:
                        type: string
                functions_config:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      display_name:
                        type: string
                      generator:
                        type: string
                      build_data:
                        type: object
                      memory:
                        type: integer
                        description: 'The function''s memory allocation in MB. Mutually exclusive with `vcpu`.

                          '
                      routes:
                        type: array
                        items:
                          type: object
                          properties:
                            pattern:
                              type: string
                            literal:
                              type: string
                            expression:
                              type: string
                            methods:
                              type: array
                              items:
                                type: string
                                enum:
                                - GET
                                - POST
                                - PUT
                                - PATCH
                                - DELETE
                                - OPTIONS
                            prefer_static:
                              type: boolean
                      excluded_routes:
                        type: array
                        items:
                          type: object
                          properties:
                            pattern:
                              type: string
                            literal:
                              type: string
                            expression:
                              type: string
                      priority:
                        type: integer
                      region:
                        type: string
                      traffic_rules:
                        type: object
                        properties:
                          action:
                            type: object
                            properties:
                              type:
                                type: string
                              config:
                                type: object
                                properties:
                                  to:
                                    type: string
                                  rate_limit_config:
                                    type: object
                                    properties:
                                      algorithm:
                                        type: string
                                        enum:
                                        - sliding_window
                                      window_size:
                                        type: integer
                                      window_limit:
                                        type: integer
                                  aggregate:
                                    type: object
                                    properties:
                                      keys:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            type:
                                              type: string
                                              enum:
                                              - ip
                                              - domain
                      vcpu:
                        type: number
                        format: float
                        description: 'Number of vCPUs to provision for the function. Allowed range is

                          0.5–2.

                          '
                      event_subscriptions:
                        type: array
                        items:
                          type: string
                branch:
                  type: string
                framework:
                  type: string
                framework_version:
                  type: string
                environment:
                  description: 'A list of deploy-specific environment variable data. Data specified this way applies only

                    to this specific deploy and is merged into any existing environment variables set on the

                    account and site.


                    Deploy-specific environment variable data takes precedence over account and site

                    environment variable data: For example, a deploy-specific variable with the key `NODE_ENV`

                    will take priority over any existing site- and account-level environment variable data

                    with the key `NODE_ENV`.


                    Environment variable data may be provided at one of two times:


                    - When creating a new Deploy with deploy files (most common)

                    - When finalizing an existing Deploy with deploy files


                    Once set, environment variables for a specific deploy cannot be modified. Subsequent

                    attempts to modify environment variable data for a deploy will be ignored.

                    '
                  type: array
                  items:
                    type: object
                    required:
                    - key
                    - value
                    - scopes
                    - is_secret
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                      is_secret:
                        type: boolean
                      scopes:
                        type: array
                        items:
                          type: string
                          enum:
                          - builds
                          - functions
                          - runtime
                          - post-processing
        required: true
      summary: Create site deploy
      x-summary-source: derived
