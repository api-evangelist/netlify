grounded_in: Platform primitives and the Netlify CLI, not the REST OpenAPI. These skills teach an agent
  to write netlify.toml, functions, edge functions and framework config and to drive the CLI. They do
  not reference REST operationIds, so they complement rather than duplicate the operation-level surface
  in openapi/ and mcp/.
