description: >-
  The entity-relationship graph of the Netlify API. Netlify's model is a strict hierarchy rooted
  at the account (team): an account owns sites, a site owns everything else, and a deploy is the
  immutable unit that everything about published content hangs off. Relationships are expressed
  as flat `*_id` foreign keys on the object, never as embedded sub-resources — there is no
  expansion mechanism, so an agent traversing the graph must make one call per hop.
identifiers:
  format: 24-character lowercase hexadecimal (MongoDB ObjectId shape)
  example: '52465f435803544542000001'
  prefixes: none
  note: >-
    Netlify uses no type prefix on identifiers, so an id alone does not say what kind of object
    it points at. A caller who loses track of which field an id came from cannot recover the type
    from the value.
naming_note: >-
  The Netlify UI calls a site a "Project". The API, the CLI, the client libraries and the
  NETLIFY_SITE_ID environment variable all still say `site` / `site_id`, and Netlify's own docs
  state these are the same value. Every relationship below uses the API name.
