graph_notes:
  - >-
    The graph is a tree, not a mesh. Almost every leaf entity carries exactly one foreign key,
    site_id, and there are no many-to-many join objects except accountMembership.
  - >-
    Because there is no expansion mechanism and no batch-get endpoint, rendering a site's full
    state costs one request per collection — roughly a dozen calls for a single site.
  - >-
    Two subgraphs, agentRunner and siteDatabase, exist only in the current upstream contract and
    are missing from the refined specs in openapi/. See lifecycle/netlify-lifecycle.yml.
