generated: '2026-08-27'
method: probed
source: >-
  Live probe of the /.well-known/ discovery surface on every apis.yml baseURL host, every
  OpenAPI servers[] host (https://api.netlify.com/api/v1), the docs/console hosts, and the
  host named by Netlify's own API catalog (netlify-mcp.netlify.app). Status is the HTTP code
  observed at fetch time on 2026-08-27. Only responses carrying a real, correctly-typed
  payload were saved verbatim.
description: >-
  Netlify serves a genuine RFC 9727 API catalog at https://www.netlify.com/.well-known/api-catalog
  (application/linkset+json). The linkset anchors two services: the REST API at
  https://api.netlify.com/api/v1 (service-desc -> https://open-api.netlify.com/swagger.json) and
  the remote MCP server at https://netlify-mcp.netlify.app/mcp (service-desc -> an MCP server card
  at https://www.netlify.com/.well-known/mcp/server-card.json). That MCP host in turn publishes
  RFC 8414 authorization-server metadata and RFC 9728 protected-resource metadata. Netlify does
  NOT serve a /.well-known/security.txt on any host probed.
notes:
  - >-
    app.netlify.com answers HTTP 200 with a text/html single-page-app shell for EVERY
    /.well-known/* path, including paths that do not exist. Those 200s are recorded here as
    shell responses and are NOT counted as served documents.
  - >-
    Netlify's bug bounty and disclosure route is published on HackerOne, not in a security.txt.
    See security/netlify-vulnerability-disclosure.yml.
